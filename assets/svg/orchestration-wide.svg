<!-- orchestration-wide.svg · lane A3 · Paste inline inside <figure class="diagram">, followed by orchestration-narrow.svg. Below 1000px the narrow variant replaces this one (CSS below). Sources: research/bakery-case-study.md Part 4 §2–§3, §7 (cfc-bakery-orders docs/agents/*). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 26 1120 198" class="dgm dgm--wide dgm-orch" role="img" aria-labelledby="dgmOrchW-t dgmOrchW-d">
  <title id="dgmOrchW-t">How José ships a ticket with AI agents</title>
  <desc id="dgmOrchW-d">José writes the brief and makes the decisions. An orchestrator agent plans, merges and holds the database lock, and hands each ticket to a builder lane working in its own git worktree. A fresh reviewer scores every change from 1 to 10; 9 or above passes, below 9 goes back for a fix and a new reviewer, at most five rounds. Passing work goes to staging, José checks it on his phone and says "passed", and only José pushes main, the live store.</desc>
  <style>
    .dgm{color:var(--ink-3,#7A807B);font-family:var(--font-text,Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif)}
    .dgm text{font-family:inherit}
    .dgm .nd{fill:var(--paper,#F6F5F1);stroke:var(--line-strong,#C6C1B5);stroke-width:1;vector-effect:non-scaling-stroke}
    .dgm .nd-acc{fill:var(--accent-soft,#DCE9F8);stroke:var(--accent,#2A78D6)}
    .dgm .nd-ink{fill:var(--ink,#121412);stroke:var(--ink,#121412)}
    .dgm .grp{fill:none;stroke:var(--line-strong,#C6C1B5);stroke-width:1;stroke-dasharray:3 4}
    .dgm .pill{fill:var(--paper-2,#EDEBE4);stroke:var(--line,#DAD6CC);stroke-width:1;vector-effect:non-scaling-stroke}
    .dgm .pill-x{fill:none;stroke:var(--line-strong,#C6C1B5);stroke-width:1;stroke-dasharray:3 3}
    .dgm .rule{fill:none;stroke:var(--line,#DAD6CC);stroke-width:1;vector-effect:non-scaling-stroke}
    .dgm .t{font-size:15px;font-weight:600;letter-spacing:-.01em;fill:var(--ink,#121412)}
    .dgm .s{font-size:12.5px;fill:var(--ink-2,#4A4F4B)}
    .dgm .s-ink{font-size:12.5px;font-weight:500;fill:var(--ink,#121412)}
    .dgm .p{font-size:12px;font-weight:500;fill:var(--ink-2,#4A4F4B)}
    .dgm .p-x{font-size:12px;fill:var(--ink-meta,#646A66)}
    .dgm .m,.dgm .el{font-family:var(--font-mono,"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace);font-size:10.5px;fill:var(--ink-meta,#646A66)}
    .dgm .m{letter-spacing:.08em}
    .dgm .el{letter-spacing:.02em}
    .dgm .acc{fill:var(--accent-ink,#1C5CAB)}
    .dgm .on-ink{fill:var(--paper,#F6F5F1)}
    .dgm .on-ink-2{fill:var(--paper,#F6F5F1);opacity:.7}
    .dgm .e{fill:none;stroke:currentColor;stroke-width:1.25;vector-effect:non-scaling-stroke}
    .dgm .e-acc{fill:none;stroke:var(--accent,#2A78D6);stroke-width:1.25;vector-effect:non-scaling-stroke}
    .dgm .e-loop{stroke-dasharray:4 4}
    .dgm .ah{fill:currentColor}
    .dgm .ah-acc{fill:var(--accent,#2A78D6)}
    .dgm .live{fill:var(--good,#1a7f37)}
    .dgm .pulse{fill:var(--accent,#2A78D6)}
    @media (prefers-reduced-motion:reduce){.dgm .pulse{display:none}}
    .diagram .dgm--wide~.dgm--narrow{display:none}
    @media (max-width:999.98px){.diagram .dgm--wide:has(~.dgm--narrow){display:none}.diagram .dgm--wide~.dgm--narrow{display:block;width:100%;max-width:480px;margin-inline:auto}}
  </style>
  <defs>
    <marker id="dgmOrchW-ah" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="ah" d="M0 .6 8 4 0 7.4z"/></marker>
    <marker id="dgmOrchW-aha" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="ah-acc" d="M0 .6 8 4 0 7.4z"/></marker>
  </defs>

  <!-- A work item travels the pipeline (hidden under reduced motion; nodes are drawn on top) -->
  <circle class="pulse" r="3.5" cx="0" cy="0">
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" path="M104 100.5H296.5V108.5H496.5V100.5H1008"/>
  </circle>

  <!-- Edges -->
  <path class="e" d="M105 100.5H137" marker-end="url(#dgmOrchW-ah)"/>
  <path class="e" d="M279 100.5H296.5V78.5H323" marker-end="url(#dgmOrchW-ah)"/>
  <path class="e" d="M296.5 100.5V108.5H323" marker-end="url(#dgmOrchW-ah)"/>
  <path class="e" d="M296.5 100.5V138.5H323" marker-end="url(#dgmOrchW-ah)"/>
  <path class="e" d="M473 78.5H496.5V138.5H473M496.5 100.5H517" marker-end="url(#dgmOrchW-ah)"/>
  <path class="e" d="M473 108.5H496.5"/>
  <path class="e-acc" d="M659 100.5H691" marker-end="url(#dgmOrchW-aha)"/>
  <text class="el acc" x="675" y="89" text-anchor="middle">9/10</text>
  <path class="e" d="M809 100.5H841" marker-end="url(#dgmOrchW-ah)"/>
  <path class="e" d="M975 100.5H1007" marker-end="url(#dgmOrchW-ah)"/>
  <path class="e e-loop" d="M588.5 149V190.5H398.5V167.5" marker-end="url(#dgmOrchW-ah)"/>
  <text class="s" x="493" y="212" text-anchor="middle">Below 9: fix, then a new reviewer · at most 5 rounds</text>

  <!-- Nodes -->
  <rect class="nd nd-ink" x="0.5" y="52.5" width="104" height="96" rx="10"/>
  <text class="m on-ink-2" x="16" y="74">HUMAN</text>
  <text class="t on-ink" x="16" y="96">José</text>
  <text class="s on-ink" x="16" y="116">Brief and</text>
  <text class="s on-ink" x="16" y="132">decisions</text>

  <rect class="nd" x="138.5" y="52.5" width="140" height="96" rx="10"/>
  <text class="m" x="154" y="74">AGENT</text>
  <text class="t" x="154" y="96">Orchestrator</text>
  <text class="s" x="154" y="116">Plans, merges,</text>
  <text class="s" x="154" y="132">holds the lock</text>

  <rect class="grp" x="312.5" y="34.5" width="172" height="132" rx="12"/>
  <text class="m" x="324" y="54">BUILDER LANES</text>
  <rect class="nd" x="324.5" y="66.5" width="148" height="24" rx="6"/>
  <text class="s-ink" x="336" y="83">#49</text>
  <text class="el" x="460" y="83" text-anchor="end">own worktree</text>
  <rect class="nd" x="324.5" y="96.5" width="148" height="24" rx="6"/>
  <text class="s-ink" x="336" y="113">#50</text>
  <text class="el" x="460" y="113" text-anchor="end">own worktree</text>
  <rect class="nd" x="324.5" y="126.5" width="148" height="24" rx="6"/>
  <text class="s-ink" x="336" y="143">#51</text>
  <text class="el" x="460" y="143" text-anchor="end">own worktree</text>

  <rect class="nd nd-acc" x="518.5" y="52.5" width="140" height="96" rx="10"/>
  <text class="m acc" x="534" y="74">AGENT · FRESH</text>
  <text class="t" x="534" y="96">Reviewer</text>
  <text class="s" x="534" y="116">Scores 1–10;</text>
  <text class="s" x="534" y="132">9 or above passes</text>

  <rect class="nd" x="692.5" y="52.5" width="116" height="96" rx="10"/>
  <text class="m" x="708" y="74">ENVIRONMENT</text>
  <text class="t" x="708" y="96">Staging</text>
  <text class="s" x="708" y="116">Orchestrator</text>
  <text class="s" x="708" y="132">pushes here</text>

  <rect class="nd nd-ink" x="842.5" y="52.5" width="132" height="96" rx="10"/>
  <text class="m on-ink-2" x="858" y="74">HUMAN</text>
  <text class="t on-ink" x="858" y="96">Phone check</text>
  <text class="s on-ink" x="858" y="116">José walks it,</text>
  <text class="s on-ink" x="858" y="132">says “passed”</text>

  <rect class="nd" x="1008.5" y="52.5" width="110" height="96" rx="10"/>
  <text class="m" x="1024" y="74">PRODUCTION</text>
  <circle class="live" cx="1028" cy="91" r="4"/>
  <text class="t" x="1038" y="96">main</text>
  <text class="s" x="1024" y="116">Live store;</text>
  <text class="s" x="1024" y="132">José pushes</text>
</svg>
