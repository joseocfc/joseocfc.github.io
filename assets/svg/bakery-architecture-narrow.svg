<!-- bakery-architecture-narrow.svg · lane A3 · Paste inline right after bakery-architecture-wide.svg inside the same <figure class="diagram">. Shown below 1000px; on its own it always shows. Source: data/architecture.json (cfc-bakery-orders @ f28ff68). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 884" class="dgm dgm--narrow dgm-arch" role="img" aria-labelledby="dgmArchN-t dgmArchN-d">
  <title id="dgmArchN-t">How a bakery order moves through the system</title>
  <desc id="dgmArchN-d">The customer and the admin set-up both feed the cake builder, pickup first. The cart and checkout re-check the date and store, and WooCommerce creates the order. Each status change (to make, ready, picked up, or cancelled with a refund) drives the emails, the print list and the staff dashboards. One token map feeds every surface: live CSS variables on the storefront, a snapshot in dashboards and print, inline literal values in email.</desc>
  <style>
    .dgm{color:var(--ink-3,#7A807B);font-family:var(--font-text,Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif)}
    .dgm text{font-family:inherit}
    .dgm .nd{fill:var(--paper,#F6F5F1);stroke:var(--line-strong,#C6C1B5);stroke-width:1;vector-effect:non-scaling-stroke}
    .dgm .nd-acc{fill:var(--accent-soft,#DCE9F8);stroke:var(--accent,#2A78D6)}
    .dgm .nd-ink{fill:var(--ink,#121412);stroke:var(--ink,#121412)}
    .dgm .grp{fill:none;stroke:var(--line-strong,#C6C1B5);stroke-width:1;stroke-dasharray:3 4}
    .dgm .pill{fill:var(--paper-2,#EDEBE4);stroke:var(--line,#DAD6CC);stroke-width:1;vector-effect:non-scaling-stroke}
    .dgm .pill-x{fill:none;stroke:var(--line-strong,#C6C1B5);stroke-width:1;stroke-dasharray:3 3}
    .dgm .rule{fill:none;stroke:var(--line,#DAD6CC);stroke-width:1;vector-effect:non-scaling-stroke}
    .dgm .t{font-size:15px;font-weight:600;letter-spacing:-.01em;fill:var(--ink,#121412)}
    .dgm .s{font-size:12.5px;fill:var(--ink-2,#4A4F4B)}
    .dgm .s-ink{font-size:12.5px;font-weight:500;fill:var(--ink,#121412)}
    .dgm .p{font-size:12px;font-weight:500;fill:var(--ink-2,#4A4F4B)}
    .dgm .p-x{font-size:12px;fill:var(--ink-meta,#646A66)}
    .dgm .m,.dgm .el{font-family:var(--font-mono,"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace);font-size:10.5px;fill:var(--ink-meta,#646A66)}
    .dgm .m{letter-spacing:.08em}
    .dgm .el{letter-spacing:.02em}
    .dgm .acc{fill:var(--accent-ink,#1C5CAB)}
    .dgm .on-ink{fill:var(--paper,#F6F5F1)}
    .dgm .on-ink-2{fill:var(--paper,#F6F5F1);opacity:.7}
    .dgm .e{fill:none;stroke:currentColor;stroke-width:1.25;vector-effect:non-scaling-stroke}
    .dgm .e-acc{fill:none;stroke:var(--accent,#2A78D6);stroke-width:1.25;vector-effect:non-scaling-stroke}
    .dgm .e-loop{stroke-dasharray:4 4}
    .dgm .ah{fill:currentColor}
    .dgm .ah-acc{fill:var(--accent,#2A78D6)}
    .dgm .live{fill:var(--good,#1a7f37)}
    .dgm .pulse{fill:var(--accent,#2A78D6)}
    .dgm.dgm--narrow .s{font-size:13px}
    .dgm.dgm--narrow .m,.dgm.dgm--narrow .el{font-size:11px}
    @media (prefers-reduced-motion:reduce){.dgm .pulse{display:none}}
    .diagram .dgm--wide~.dgm--narrow{display:none}
    @media (max-width:999.98px){.diagram .dgm--wide:has(~.dgm--narrow){display:none}.diagram .dgm--wide~.dgm--narrow{display:block;width:100%;max-width:480px;margin-inline:auto}}
  </style>
  <defs>
    <marker id="dgmArchN-ah" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="ah" d="M0 .6 8 4 0 7.4z"/></marker>
    <marker id="dgmArchN-ahs" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path class="ah" d="M0 .6 8 4 0 7.4z"/></marker>
  </defs>

  <!-- Two inputs feed the builder -->
  <rect class="nd" x="0.5" y="8.5" width="168" height="92" rx="10"/>
  <text class="m" x="16" y="30">CUSTOMER</text>
  <text class="t" x="16" y="52">Orders a cake</text>
  <text class="s" x="16" y="70">Phone or laptop,</text>
  <text class="s" x="16" y="86">picks up in store</text>

  <rect class="nd" x="191.5" y="8.5" width="168" height="92" rx="10"/>
  <text class="m" x="207" y="30">ADMIN</text>
  <text class="t" x="207" y="52">Set-up</text>
  <text class="s" x="207" y="70">Settings, catalogs,</text>
  <text class="s" x="207" y="86">sizes, imports</text>

  <path class="e" d="M84.5 101V135.5" marker-end="url(#dgmArchN-ah)"/>
  <path class="e" d="M275.5 101V135.5" marker-end="url(#dgmArchN-ah)"/>

  <rect class="nd" x="0.5" y="136.5" width="359" height="92" rx="10"/>
  <text class="m" x="16" y="158">STOREFRONT</text>
  <text class="t" x="16" y="180">Cake builder</text>
  <text class="s" x="16" y="198">Pickup first, then size, flavour,</text>
  <text class="s" x="16" y="214">frosting and extras</text>

  <path class="e" d="M180.5 229V263.5" marker-end="url(#dgmArchN-ah)"/>

  <rect class="nd" x="0.5" y="264.5" width="359" height="92" rx="10"/>
  <text class="m" x="16" y="286">STOREFRONT</text>
  <text class="t" x="16" y="308">Cart and checkout</text>
  <text class="s" x="16" y="326">Date and store are re-checked</text>
  <text class="s" x="16" y="342">at the click</text>

  <path class="e" d="M180.5 357V391.5" marker-end="url(#dgmArchN-ah)"/>

  <rect class="nd" x="0.5" y="392.5" width="359" height="130" rx="10"/>
  <text class="m" x="16" y="414">WOOCOMMERCE</text>
  <text class="t" x="16" y="436">Order and status</text>
  <rect class="pill" x="16.5" y="450.5" width="70" height="24" rx="12"/>
  <text class="p" x="51.5" y="466.5" text-anchor="middle">To make</text>
  <path class="e" d="M87 462.5H107" marker-end="url(#dgmArchN-ahs)"/>
  <rect class="pill" x="108.5" y="450.5" width="58" height="24" rx="12"/>
  <text class="p" x="137.5" y="466.5" text-anchor="middle">Ready</text>
  <path class="e" d="M167 462.5H187" marker-end="url(#dgmArchN-ahs)"/>
  <rect class="pill" x="188.5" y="450.5" width="82" height="24" rx="12"/>
  <text class="p" x="229.5" y="466.5" text-anchor="middle">Picked up</text>
  <rect class="pill-x" x="16.5" y="484.5" width="132" height="24" rx="12"/>
  <text class="p-x" x="82.5" y="500.5" text-anchor="middle">Cancelled · refund</text>

  <!-- Each status change fans out -->
  <path class="e" d="M180.5 523V546.5M56.5 546.5H304.5"/>
  <path class="e" d="M56.5 546.5V569.5" marker-end="url(#dgmArchN-ah)"/>
  <path class="e" d="M180.5 546.5V569.5" marker-end="url(#dgmArchN-ah)"/>
  <path class="e" d="M304.5 546.5V569.5" marker-end="url(#dgmArchN-ah)"/>
  <text class="el" x="188" y="539">each status change</text>

  <rect class="nd" x="0.5" y="570.5" width="112" height="92" rx="10"/>
  <text class="m" x="12" y="590">EMAIL</text>
  <text class="t" x="12" y="612">Emails</text>
  <text class="s" x="12" y="630">Sent once</text>
  <text class="s" x="12" y="646">per status</text>

  <rect class="nd" x="124.5" y="570.5" width="112" height="92" rx="10"/>
  <text class="m" x="136" y="590">PRINT</text>
  <text class="t" x="136" y="612">Print list</text>
  <text class="s" x="136" y="630">On a click,</text>
  <text class="s" x="136" y="646">via a runner</text>

  <rect class="nd" x="247.5" y="570.5" width="112" height="92" rx="10"/>
  <text class="m" x="259" y="590">STAFF</text>
  <text class="t" x="259" y="612">Dashboards</text>
  <text class="s" x="259" y="630">Bakery, deli,</text>
  <text class="s" x="259" y="646">60 s refresh</text>

  <!-- One token map feeds every surface -->
  <rect class="nd nd-acc" x="0.5" y="694.5" width="359" height="182" rx="10"/>
  <text class="m acc" x="16" y="716">DESIGN TOKENS</text>
  <text class="t" x="16" y="738">One token map, every surface</text>
  <text class="s" x="16" y="756">tokens.php · 200 names</text>
  <path class="rule" d="M16 772.5H344"/>
  <text class="s" x="16" y="789">Storefront</text>
  <text class="el acc" x="344" y="789" text-anchor="end">LIVE var()</text>
  <path class="rule" d="M16 797.5H344"/>
  <text class="s" x="16" y="814">Dashboards, settings</text>
  <text class="el acc" x="344" y="814" text-anchor="end">SNAPSHOT</text>
  <path class="rule" d="M16 822.5H344"/>
  <text class="s" x="16" y="839">Print ticket</text>
  <text class="el acc" x="344" y="839" text-anchor="end">SNAPSHOT</text>
  <path class="rule" d="M16 847.5H344"/>
  <text class="s" x="16" y="864">Email</text>
  <text class="el acc" x="344" y="864" text-anchor="end">INLINE · zero var()</text>
</svg>
