<!-- orchestration-narrow.svg · lane A3 · Paste inline right after orchestration-wide.svg inside the same <figure class="diagram">. Shown below 1000px; on its own it always shows. Sources: research/bakery-case-study.md Part 4 §2–§3, §7. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" class="dgm dgm--narrow dgm-orch" role="img" aria-labelledby="dgmOrchN-t dgmOrchN-d">
  <title id="dgmOrchN-t">How José ships a ticket with AI agents</title>
  <desc id="dgmOrchN-d">José writes the brief and makes the decisions. An orchestrator agent plans, merges and holds the database lock, and hands each ticket to a builder lane in its own git worktree. A fresh reviewer scores every change from 1 to 10; 9 or above passes, below 9 goes back for a fix and a new reviewer. Passing work goes to staging, José checks it on his phone and says "passed", and only José pushes main, the live store.</desc>
  <style>
    .dgm{color:var(--ink-3,#7A807B);font-family:var(--font-text,Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif)}
    .dgm text{font-family:inherit}
    .dgm .nd{fill:var(--paper,#F6F5F1);stroke:var(--line-strong,#C6C1B5);stroke-width:1;vector-effect:non-scaling-stroke}
    .dgm .nd-acc{fill:var(--accent-soft,#DCE9F8);stroke:var(--accent,#2A78D6)}
    .dgm .nd-ink{fill:var(--ink,#121412);stroke:var(--ink,#121412)}
    .dgm .grp{fill:none;stroke:var(--line-strong,#C6C1B5);stroke-width:1;stroke-dasharray:3 4}
    .dgm .pill{fill:var(--paper-2,#EDEBE4);stroke:var(--line,#DAD6CC);stroke-width:1;vector-effect:non-scaling-stroke}
    .dgm .pill-x{fill:none;stroke:var(--line-strong,#C6C1B5);stroke-width:1;stroke-dasharray:3 3}
    .dgm .rule{fill:none;stroke:var(--line,#DAD6CC);stroke-width:1;vector-effect:non-scaling-stroke}
    .dgm .t{font-size:15px;font-weight:600;letter-spacing:-.01em;fill:var(--ink,#121412)}
    .dgm .s{font-size:12.5px;fill:var(--ink-2,#4A4F4B)}
    .dgm .s-ink{font-size:12.5px;font-weight:500;fill:var(--ink,#121412)}
    .dgm .p{font-size:12px;font-weight:500;fill:var(--ink-2,#4A4F4B)}
    .dgm .p-x{font-size:12px;fill:var(--ink-meta,#646A66)}
    .dgm .m,.dgm .el{font-family:var(--font-mono,"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace);font-size:10.5px;fill:var(--ink-meta,#646A66)}
    .dgm .m{letter-spacing:.08em}
    .dgm .el{letter-spacing:.02em}
    .dgm .acc{fill:var(--accent-ink,#1C5CAB)}
    .dgm .on-ink{fill:var(--paper,#F6F5F1)}
    .dgm .on-ink-2{fill:var(--paper,#F6F5F1);opacity:.7}
    .dgm .e{fill:none;stroke:currentColor;stroke-width:1.25;vector-effect:non-scaling-stroke}
    .dgm .e-acc{fill:none;stroke:var(--accent,#2A78D6);stroke-width:1.25;vector-effect:non-scaling-stroke}
    .dgm .e-loop{stroke-dasharray:4 4}
    .dgm .ah{fill:currentColor}
    .dgm .ah-acc{fill:var(--accent,#2A78D6)}
    .dgm .live{fill:var(--good,#1a7f37)}
    .dgm .pulse{fill:var(--accent,#2A78D6)}
    .dgm.dgm--narrow .s{font-size:13px}
    .dgm.dgm--narrow .m,.dgm.dgm--narrow .el{font-size:11px}
    @media (prefers-reduced-motion:reduce){.dgm .pulse{display:none}}
    .diagram .dgm--wide~.dgm--narrow{display:none}
    @media (max-width:999.98px){.diagram .dgm--wide:has(~.dgm--narrow){display:none}.diagram .dgm--wide~.dgm--narrow{display:block;width:100%;max-width:480px;margin-inline:auto}}
  </style>
  <defs>
    <marker id="dgmOrchN-ah" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="ah" d="M0 .6 8 4 0 7.4z"/></marker>
    <marker id="dgmOrchN-aha" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="ah-acc" d="M0 .6 8 4 0 7.4z"/></marker>
  </defs>

  <circle class="pulse" r="3.5" cx="0" cy="0">
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" path="M156.5 84V672"/>
  </circle>

  <!-- Edges -->
  <path class="e" d="M156.5 85V111.5" marker-end="url(#dgmOrchN-ah)"/>
  <path class="e" d="M156.5 189V211.5" marker-end="url(#dgmOrchN-ah)"/>
  <path class="e" d="M156.5 317V341.5" marker-end="url(#dgmOrchN-ah)"/>
  <path class="e e-loop" d="M313 388.5H338.5V264.5H313.5" marker-end="url(#dgmOrchN-ah)"/>
  <path class="e-acc" d="M156.5 435V463.5" marker-end="url(#dgmOrchN-aha)"/>
  <text class="el acc" x="166" y="453">9/10 passes</text>
  <path class="e" d="M156.5 541V567.5" marker-end="url(#dgmOrchN-ah)"/>
  <path class="e" d="M156.5 645V671.5" marker-end="url(#dgmOrchN-ah)"/>
  <text class="el" x="166" y="662">José pushes</text>

  <!-- Nodes -->
  <rect class="nd nd-ink" x="0.5" y="8.5" width="312" height="76" rx="10"/>
  <text class="m on-ink-2" x="16" y="28">HUMAN</text>
  <text class="t on-ink" x="16" y="50">José</text>
  <text class="s on-ink" x="16" y="70">Writes the brief, makes the decisions</text>

  <rect class="nd" x="0.5" y="112.5" width="312" height="76" rx="10"/>
  <text class="m" x="16" y="132">AGENT</text>
  <text class="t" x="16" y="154">Orchestrator</text>
  <text class="s" x="16" y="174">Plans, merges lanes, holds the lock</text>

  <rect class="grp" x="0.5" y="212.5" width="312" height="104" rx="12"/>
  <text class="m" x="16" y="234">BUILDER LANES · OWN WORKTREE EACH</text>
  <rect class="nd" x="12.5" y="246.5" width="88" height="56" rx="6"/>
  <text class="t" x="24" y="270">#49</text>
  <text class="el" x="24" y="290">worktree</text>
  <rect class="nd" x="112.5" y="246.5" width="88" height="56" rx="6"/>
  <text class="t" x="124" y="270">#50</text>
  <text class="el" x="124" y="290">worktree</text>
  <rect class="nd" x="212.5" y="246.5" width="88" height="56" rx="6"/>
  <text class="t" x="224" y="270">#51</text>
  <text class="el" x="224" y="290">worktree</text>

  <rect class="nd nd-acc" x="0.5" y="342.5" width="312" height="92" rx="10"/>
  <text class="m acc" x="16" y="362">AGENT · FRESH</text>
  <text class="t" x="16" y="384">Reviewer</text>
  <text class="s" x="16" y="404">Scores 1–10; 9 or above passes</text>
  <text class="s" x="16" y="420">Below 9: fix, then a new reviewer</text>

  <rect class="nd" x="0.5" y="464.5" width="312" height="76" rx="10"/>
  <text class="m" x="16" y="484">ENVIRONMENT</text>
  <text class="t" x="16" y="506">Staging</text>
  <text class="s" x="16" y="526">The orchestrator pushes here</text>

  <rect class="nd nd-ink" x="0.5" y="568.5" width="312" height="76" rx="10"/>
  <text class="m on-ink-2" x="16" y="588">HUMAN</text>
  <text class="t on-ink" x="16" y="610">Phone check</text>
  <text class="s on-ink" x="16" y="630">José walks it and says “passed”</text>

  <rect class="nd" x="0.5" y="672.5" width="312" height="76" rx="10"/>
  <text class="m" x="16" y="692">PRODUCTION</text>
  <circle class="live" cx="20" cy="709" r="4"/>
  <text class="t" x="30" y="714">main</text>
  <text class="s" x="16" y="734">The live store; only José pushes it</text>
</svg>
