<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>José Ochoa</title>
  <style>
    .m { fill: none; stroke: #2A78D6; stroke-width: 3.25; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) { .m { stroke: #6DA7EC; } }
  </style>
  <!-- Two strokes: a J (a bar with a hook) and an O (a point). Reads as "jo" and as a data mark. -->
  <path class="m" d="M12 5.5v14a6.5 6.5 0 0 1-6.5 6.5"/>
  <circle class="m" cx="21.5" cy="19.5" r="6.5"/>
</svg>
